<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spartacus</title>
</head>
<body style="margin:0;padding:0;background-color:#0B0D12;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0B0D12;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding:0 0 24px;">
              <img src="https://spartacus.app.br/logo.png" alt="Spartacus" width="64" height="64" style="display:block;border-radius:50%;border:2px solid rgba(198,163,78,0.3);">
            </td>
          </tr>

          <!-- Card principal -->
          <tr>
            <td style="background-color:#1A1D25;border-radius:16px;border:1px solid #2A2D38;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">

                <!-- Header -->
                <tr>
                  <td style="padding:32px 32px 16px;">
                    <h1 style="margin:0;font-size:22px;font-weight:700;color:#C6A34E;letter-spacing:0.5px;">
                      {{title}}
                    </h1>
                  </td>
                </tr>

                <!-- Saudacao + mensagem -->
                <tr>
                  <td style="padding:0 32px 24px;">
                    <p style="margin:0 0 16px;font-size:15px;color:#E5E5E5;line-height:1.6;">
                      Olá, {{name}}.
                    </p>
                    <p style="margin:0;font-size:15px;color:#9099A8;line-height:1.6;">
                      {{{message}}}
                    </p>
                  </td>
                </tr>

                <!-- CTA (opcional) -->
                {{#if cta_text}}
                <tr>
                  <td style="padding:8px 32px 32px;">
                    <table role="presentation" cellpadding="0" cellspacing="0">
                      <tr>
                        <td style="background-color:#C6A34E;border-radius:8px;">
                          <a href="{{cta_url}}" target="_blank" style="display:inline-block;padding:14px 32px;font-size:15px;font-weight:700;color:#0B0D12;text-decoration:none;">
                            {{cta_text}}
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                {{/if}}

                {{#unless cta_text}}
                <tr>
                  <td style="padding:0 0 16px;"></td>
                </tr>
                {{/unless}}

              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding:24px 0 0;">
              <p style="margin:0;font-size:12px;color:#9099A8;">
                Spartacus Artes Marciais — Brasnorte, MT
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
