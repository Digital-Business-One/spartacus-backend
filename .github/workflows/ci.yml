name: CI/CD — Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed a executar"
        required: true
        default: "classes"
        type: choice
        options:
          - root_project
          - modalities
          - classes
          - admin_account
          - all

env:
  REGION: us-east1

jobs:
  # ─── Lint & Testes unitários ────────────────────────────────────────────────
  test:
    name: Lint & Unit Tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check app/

      - name: Unit tests
        run: uv run pytest

  # ─── Testes de integração (Firebase Emulators via infra docker-compose) ──────
  # test-integration:
  #   name: Integration Tests
  #   needs: test
  #   if: github.event_name != 'workflow_dispatch'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         path: backend
  #
  #     - uses: actions/checkout@v4
  #       with:
  #         repository: Digital-Business-One/spartacus-infra
  #         path: infra
  #         token: ${{ secrets.GITHUB_TOKEN }}
  #
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.12"
  #
  #     - name: Install uv
  #       run: pip install uv
  #
  #     - name: Install dependencies
  #       working-directory: backend
  #       run: uv sync
  #
  #     - name: Start Firebase Emulators (from infra docker-compose)
  #       working-directory: infra
  #       run: |
  #         docker compose up -d emulators
  #         echo "Waiting for emulators..."
  #         for i in $(seq 1 30); do
  #           curl -sf http://localhost:4000 && break || sleep 2
  #         done
  #
  #     - name: Integration tests
  #       working-directory: backend
  #       env:
  #         FIRESTORE_EMULATOR_HOST: localhost:8080
  #         FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
  #         FIREBASE_STORAGE_EMULATOR_HOST: localhost:9199
  #         GOOGLE_CLOUD_PROJECT: spartacus-artes-marciais
  #         ROOT_PROJECT_ID: spartacus-artes-marciais
  #       run: uv run pytest tests/integration/ -v
  #
  #     - name: Stop emulators
  #       if: always()
  #       working-directory: infra
  #       run: docker compose down

  # ─── Detectar quais paths mudaram ────────────────────────────────────────────
  changes:
    name: Detect changed paths
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      fn_send_email: ${{ steps.filter.outputs.fn_send_email }}
      fn_orchestrator: ${{ steps.filter.outputs.fn_orchestrator }}
      fn_send_push: ${{ steps.filter.outputs.fn_send_push }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          # Shared files affecting all function deploys (firebase.json
          # declares all codebases; .firebaserc and storage.rules are
          # consumed by `firebase deploy`; the workflow itself drives
          # the deploy steps).
          SHARED_RE='^(firebase\.json|\.firebaserc|storage\.rules|\.github/workflows/ci\.yml)$'
          if echo "$CHANGED" | grep -qE "$SHARED_RE"; then
            SHARED=true
          else
            SHARED=false
          fi

          # backend = anything outside functions/ AND not a shared-only file
          if echo "$CHANGED" | grep -qvE '^functions/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          # fn_send_email = changes inside functions/send_email/ OR shared
          if [ "$SHARED" = "true" ] || echo "$CHANGED" | grep -qE '^functions/send_email/'; then
            echo "fn_send_email=true" >> "$GITHUB_OUTPUT"
          else
            echo "fn_send_email=false" >> "$GITHUB_OUTPUT"
          fi
          # fn_orchestrator = changes inside functions/orchestrator/ OR shared
          if [ "$SHARED" = "true" ] || echo "$CHANGED" | grep -qE '^functions/orchestrator/'; then
            echo "fn_orchestrator=true" >> "$GITHUB_OUTPUT"
          else
            echo "fn_orchestrator=false" >> "$GITHUB_OUTPUT"
          fi
          # fn_send_push = changes inside functions/send_push/ OR shared
          if [ "$SHARED" = "true" ] || echo "$CHANGED" | grep -qE '^functions/send_push/'; then
            echo "fn_send_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "fn_send_push=false" >> "$GITHUB_OUTPUT"
          fi

  # ─── Deploy → Cloud Run ─────────────────────────────────────────────────────
  deploy:
    name: Deploy → Cloud Run
    needs: [test, changes]
    if: github.event_name == 'push' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ secrets.FIREBASE_PROJECT_ID }}/spartacus-backend/api
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar no GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build imagem Docker
        run: |
          docker build \
            --platform linux/amd64 \
            --target prod \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.IMAGE }}:latest \
            .

      - name: Push imagem para Artifact Registry
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.IMAGE }}:latest

      - name: Deploy no Cloud Run
        run: |
          gcloud run deploy spartacus-backend \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --quiet

  # ─── Deploy → Cloud Functions (via firebase-tools) ───────────────────────────
  # Uses `firebase deploy --only functions:<codebase>` against firebase.json so
  # the @firestore_fn decorators (firebase-functions Python SDK) are discovered
  # the same way the local emulator does. Required: deploys via raw
  # `gcloud functions deploy` don't run firebase-functions discovery and the
  # runtime falls back to the legacy (data, context) signature, breaking the
  # entry point with TypeError. See dev/main #orchestrator-bug for context.
  deploy-fn-send-email:
    name: Deploy → send-email
    needs: [test, changes]
    if: github.event_name == 'push' && needs.changes.outputs.fn_send_email == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar no GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Create venv for send-email codebase
        run: |
          cd functions/send_email
          python3.12 -m venv venv
          venv/bin/pip install --quiet -r requirements.txt

      - name: Deploy send-email codebase
        run: |
          firebase deploy \
            --only functions:send-email \
            --project ${{ secrets.FIREBASE_PROJECT_ID }} \
            --non-interactive \
            --force

  deploy-fn-orchestrator:
    name: Deploy → event-orchestrator
    needs: [test, changes]
    if: github.event_name == 'push' && needs.changes.outputs.fn_orchestrator == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar no GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Create venv for orchestrator codebase
        run: |
          cd functions/orchestrator
          python3.12 -m venv venv
          venv/bin/pip install --quiet -r requirements.txt

      - name: Deploy orchestrator codebase
        run: |
          firebase deploy \
            --only functions:orchestrator \
            --project ${{ secrets.FIREBASE_PROJECT_ID }} \
            --non-interactive \
            --force

  deploy-fn-send-push:
    name: Deploy → send-push
    needs: [test, changes]
    if: github.event_name == 'push' && needs.changes.outputs.fn_send_push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar no GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Create venv for send-push codebase
        run: |
          cd functions/send_push
          python3.12 -m venv venv
          venv/bin/pip install --quiet -r requirements.txt

      - name: Deploy send-push codebase
        run: |
          firebase deploy \
            --only functions:send-push \
            --project ${{ secrets.FIREBASE_PROJECT_ID }} \
            --non-interactive \
            --force

  # ─── Seed (manual via workflow_dispatch) ────────────────────────────────────
  seed:
    name: Seed → Firestore
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Autenticar no GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Seed ROOT project
        if: inputs.seed == 'root_project' || inputs.seed == 'all'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          ROOT_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_PROJECT_ID }}.firebasestorage.app
        run: uv run python seeds/seed_root_project.py

      - name: Seed modalities + classes (migration)
        if: inputs.seed == 'modalities' || inputs.seed == 'all'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          ROOT_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: uv run python seeds/seed_modalities_and_classes.py

      - name: Seed classes (legacy)
        if: inputs.seed == 'classes'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          ROOT_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: uv run python seeds/seed_classes.py

      - name: Seed admin account
        if: inputs.seed == 'admin_account' || inputs.seed == 'all'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          ROOT_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: uv run python seeds/seed_admin_account.py
