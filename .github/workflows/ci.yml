name: CI/CD — Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed a executar"
        required: true
        default: "classes"
        type: choice
        options:
          - classes
          - all

env:
  REGION: us-east1

jobs:
  # ─── Lint & Testes unitários ────────────────────────────────────────────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check app/

      - name: Unit tests
        run: uv run pytest

  # ─── Testes de integração (Firebase Emulators) ─────────────────────────────
  test-integration:
    name: Integration Tests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Integration tests (emuladores gerenciados pelo pytest)
        run: uv run pytest tests/integration/ -v

  # ─── Deploy → Cloud Run ─────────────────────────────────────────────────────
  deploy:
    name: Deploy → Cloud Run
    needs: [test, test-integration]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ secrets.FIREBASE_PROJECT_ID }}/spartacus-backend/api
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar no GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build imagem Docker
        run: |
          docker build \
            --platform linux/amd64 \
            --target prod \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.IMAGE }}:latest \
            .

      - name: Push imagem para Artifact Registry
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.IMAGE }}:latest

      - name: Deploy no Cloud Run
        run: |
          gcloud run deploy spartacus-backend \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --quiet

  # ─── Seed (manual via workflow_dispatch) ────────────────────────────────────
  seed:
    name: Seed → Firestore
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Autenticar no GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Seed classes
        if: inputs.seed == 'classes' || inputs.seed == 'all'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          ROOT_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: uv run python seeds/seed_classes.py

      - name: Seed ROOT project
        if: inputs.seed == 'all'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          ROOT_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_PROJECT_ID }}.firebasestorage.app
        run: uv run python seeds/seed.py
