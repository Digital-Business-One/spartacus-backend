name: CI/CD — Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed a executar"
        required: true
        default: "classes"
        type: choice
        options:
          - root_project
          - modalities
          - classes
          - admin_account
          - all

env:
  REGION: us-east1

jobs:
  # ─── Lint & Testes unitários ────────────────────────────────────────────────
  test:
    name: Lint & Unit Tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check app/

      - name: Unit tests
        run: uv run pytest

  # ─── Testes de integração (Firebase Emulators) — desabilitado temporariamente
  # test-integration:
  #   name: Integration Tests
  #   needs: test
  #   if: github.event_name != 'workflow_dispatch'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.12"
  #     - name: Install uv
  #       run: pip install uv
  #     - name: Install dependencies
  #       run: uv sync
  #     - name: Integration tests (emuladores gerenciados pelo pytest)
  #       run: uv run pytest tests/integration/ -v

  # ─── Detectar quais paths mudaram ────────────────────────────────────────────
  changes:
    name: Detect changed paths
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      function: ${{ steps.filter.outputs.function }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          # backend = anything outside functions/
          if echo "$CHANGED" | grep -qvE '^functions/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          # function = anything inside functions/
          if echo "$CHANGED" | grep -qE '^functions/'; then
            echo "function=true" >> "$GITHUB_OUTPUT"
          else
            echo "function=false" >> "$GITHUB_OUTPUT"
          fi

  # ─── Deploy → Cloud Run ─────────────────────────────────────────────────────
  deploy:
    name: Deploy → Cloud Run
    needs: [test, changes]
    if: github.event_name == 'push' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ secrets.FIREBASE_PROJECT_ID }}/spartacus-backend/api
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar no GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build imagem Docker
        run: |
          docker build \
            --platform linux/amd64 \
            --target prod \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.IMAGE }}:latest \
            .

      - name: Push imagem para Artifact Registry
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.IMAGE }}:latest

      - name: Deploy no Cloud Run
        run: |
          gcloud run deploy spartacus-backend \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --quiet

  # ─── Deploy → Cloud Function (send-email) ──────────────────────────────────
  deploy-function:
    name: Deploy → Cloud Function
    needs: [test, changes]
    if: github.event_name == 'push' && needs.changes.outputs.function == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar no GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Cloud Function send-email
        run: |
          gcloud functions deploy send-email \
            --gen2 \
            --runtime python312 \
            --region ${{ env.REGION }} \
            --source ./functions/send_email \
            --entry-point handle_firestore \
            --trigger-event-filters="type=google.cloud.firestore.document.v1.created" \
            --trigger-event-filters="database=(default)" \
            --trigger-event-filters-path-pattern="document=notifications/{docId}" \
            --trigger-location=${{ env.REGION }} \
            --service-account fn-send-email@${{ secrets.FIREBASE_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-secrets SENDGRID_API_KEY=SENDGRID_API_KEY:latest \
            --memory 256Mi \
            --timeout 30s \
            --quiet

  # ─── Seed (manual via workflow_dispatch) ────────────────────────────────────
  seed:
    name: Seed → Firestore
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Autenticar no GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Seed ROOT project
        if: inputs.seed == 'root_project' || inputs.seed == 'all'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          ROOT_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_PROJECT_ID }}.firebasestorage.app
        run: uv run python seeds/seed_root_project.py

      - name: Seed modalities + classes (migration)
        if: inputs.seed == 'modalities' || inputs.seed == 'all'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          ROOT_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: uv run python seeds/seed_modalities_and_classes.py

      - name: Seed classes (legacy)
        if: inputs.seed == 'classes'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          ROOT_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: uv run python seeds/seed_classes.py

      - name: Seed admin account
        if: inputs.seed == 'admin_account' || inputs.seed == 'all'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          ROOT_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: uv run python seeds/seed_admin_account.py
